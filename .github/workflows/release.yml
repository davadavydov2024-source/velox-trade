name: Release apps

# Новая версия приложений: git tag v1.0.0 && git push --tags (или запуск вручную во вкладке Actions).
# Собирает Windows-установщик и Android APK и кладёт их в GitHub Releases. Страница на сайте (/) сама подхватывает последний релиз.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v1.0.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Иконка
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/build | Out-Null
          Copy-Item public/miligram/icon-512.png desktop/build/icon.png
      - name: Сборка установщика
        shell: pwsh
        working-directory: desktop
        run: |
          $v = "$env:TAG".TrimStart('v')
          npm install --no-audit --no-fund
          npm version $v --no-git-tag-version --allow-same-version
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/MiliGram-Setup.exe
            desktop/dist/MiliGram-Setup.exe.blockmap
            desktop/dist/latest.yml

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Создаём Android-проект
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
      - name: Иконка и заставка
        working-directory: android-app/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert "$GITHUB_WORKSPACE/public/miligram/icon-512.png" -resize ${s}x${s} "mipmap-$d/$n.png"
            done
          done
          find . -name splash.png -exec convert -size 480x480 xc:black {} \;
      - name: Версия
        working-directory: android-app/android/app
        run: |
          v="${TAG#v}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${v}\"/" build.gradle
      - name: Сборка APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            cd app/build/outputs/apk/release
            "$BT/zipalign" -f -p 4 app-release-unsigned.apk aligned.apk
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass pass:"$KEYSTORE_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASS" --out "$GITHUB_WORKSPACE/MiliGram.apk" aligned.apk
          else
            echo "::warning::Секреты подписи не заданы — собираю debug-APK (см. android-app/README.md)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MiliGram.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MiliGram.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MiliGram ${{ env.TAG }}
          generate_release_notes: true
          files: |
            out/MiliGram-Setup.exe
            out/MiliGram-Setup.exe.blockmap
            out/latest.yml
            out/MiliGram.apk
