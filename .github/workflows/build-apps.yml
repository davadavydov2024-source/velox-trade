name: Build APK and EXE

# Запуск: GitHub → вкладка Actions → "Build APK and EXE" → Run workflow
# Или автоматически при пуше тега вида v1.0.0
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Адрес мессенджера, который открывают приложения"
        default: "https://mili-gram.vercel.app/m"
        required: true
      release:
        description: "Выложить файлы в GitHub Releases (тег apps)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

env:
  APP_URL: ${{ inputs.url || 'https://mili-gram.vercel.app/m' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir app-android && cd app-android
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www && echo '<!doctype html><title>MiliGram</title>' > www/index.html
          HOST=$(node -e "console.log(new URL(process.env.APP_URL).host)")
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.miligram.app",
            "appName": "MiliGram",
            "webDir": "www",
            "server": {
              "url": "${APP_URL}",
              "cleartext": false,
              "allowNavigation": ["${HOST}", "*.vercel.app", "*.firebaseapp.com", "accounts.google.com", "*.google.com", "oauth.telegram.org", "telegram.org", "t.me"]
            }
          }
          EOF
          npx cap add android

      - name: App icon (optional, if app-icon.png exists in repo root)
        run: |
          if [ -f app-icon.png ]; then
            cd app-android
            mkdir -p assets
            cp ../app-icon.png assets/icon-only.png
            cp ../app-icon.png assets/icon-foreground.png
            npm i -D @capacitor/assets@3
            npx capacitor-assets generate --android --iconBackgroundColor '#0B0B0D' --iconBackgroundColorDark '#0B0B0D' || echo "icon step skipped"
          else
            echo "app-icon.png not found - using default icon"
          fi

      - name: Set version
        run: |
          cd app-android/android/app
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle

      - name: Build APK
        run: |
          cd app-android/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: cp app-android/android/app/build/outputs/apk/debug/app-debug.apk MiliGram.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiliGram-apk
          path: MiliGram.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Electron project
        run: |
          mkdir app-desktop && cd app-desktop
          mkdir build
          if [ -f ../app-icon.png ]; then cp ../app-icon.png build/icon.png; fi
          cat > package.json <<'EOF'
          {
            "name": "miligram-desktop",
            "version": "1.0.0",
            "description": "MiliGram",
            "main": "main.js",
            "author": "MiliGram",
            "build": {
              "appId": "com.miligram.desktop",
              "productName": "MiliGram",
              "directories": { "output": "dist", "buildResources": "build" },
              "files": ["main.js"],
              "win": { "target": ["nsis", "portable"] },
              "nsis": { "oneClick": false, "allowToChangeInstallationDirectory": true, "artifactName": "MiliGram-Setup.${ext}" },
              "portable": { "artifactName": "MiliGram-Portable.${ext}" }
            }
          }
          EOF
          cat > main.js <<'EOF'
          const { app, BrowserWindow, shell, Menu } = require("electron");

          const APP_URL = process.env.MILIGRAM_URL || "__APP_URL__";
          const APP_HOST = new URL(APP_URL).host;
          const INTERNAL = [/\.firebaseapp\.com$/, /^accounts\.google\.com$/, /\.google\.com$/, /^oauth\.telegram\.org$/, /^telegram\.org$/];

          function isInternal(url) {
            try {
              const h = new URL(url).host;
              return h === APP_HOST || INTERNAL.some((r) => r.test(h));
            } catch {
              return false;
            }
          }

          if (!app.requestSingleInstanceLock()) app.quit();

          let win;
          function createWindow() {
            win = new BrowserWindow({
              width: 1200,
              height: 800,
              minWidth: 380,
              minHeight: 560,
              backgroundColor: "#0B0B0D",
              autoHideMenuBar: true,
              title: "MiliGram",
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            Menu.setApplicationMenu(null);
            // без «Electron» в User-Agent, чтобы вход через Google/Telegram не блокировался
            win.webContents.setUserAgent(win.webContents.getUserAgent().replace(/\sElectron\/\S+/, "").replace(/\smiligram-desktop\/\S+/, ""));
            win.loadURL(APP_URL);
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (isInternal(url)) return { action: "allow" };
              shell.openExternal(url);
              return { action: "deny" };
            });
            win.webContents.on("will-navigate", (e, url) => {
              if (!isInternal(url)) {
                e.preventDefault();
                shell.openExternal(url);
              }
            });
          }

          app.whenReady().then(createWindow);
          app.on("second-instance", () => {
            if (win) {
              if (win.isMinimized()) win.restore();
              win.focus();
            }
          });
          app.on("window-all-closed", () => app.quit());
          EOF
          sed -i "s#__APP_URL__#${APP_URL}#" main.js
          npm pkg set version="1.0.${{ github.run_number }}"
          npm i -D electron@33 electron-builder@25

      - name: Build EXE
        run: |
          cd app-desktop
          npx electron-builder --win nsis portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: MiliGram-exe
          path: |
            app-desktop/dist/MiliGram-Setup.exe
            app-desktop/dist/MiliGram-Portable.exe

  release:
    name: Publish to GitHub Releases
    needs: [android, windows]
    if: ${{ github.event_name == 'push' || inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'apps' }}
          target_commitish: ${{ github.sha }}
          name: MiliGram apps (build ${{ github.run_number }})
          body: |
            Android: MiliGram.apk
            Windows: MiliGram-Setup.exe (установщик) или MiliGram-Portable.exe (без установки)
          files: out/*
